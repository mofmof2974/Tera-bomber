<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ファイブボンバー管理画面</title>
    <style>
      :root {
        --bg: #121826;
        --card: #1d2435;
        --muted: #cdd9ef;
        --accent: #7dd3fc;
        --accent-2: #f9a8d4;
        --danger: #f87171;
        --ok: #34d399;
        --line: rgba(255, 255, 255, 0.1);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family:
          'Segoe UI', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif;
        background: linear-gradient(180deg, #0b1120, #111827 100%);
        color: white;
      }

      .app {
        display: grid;
        grid-template-columns: 1.2fr 0.8fr;
        gap: 20px;
        min-height: 100vh;
        padding: 22px;
      }

      .panel {
        background: rgba(29, 36, 53, 0.96);
        border: 1px solid var(--line);
        border-radius: 18px;
        box-shadow: 0 18px 42px rgba(0, 0, 0, 0.2);
      }

      .main {
        padding: 18px;
      }

      .sidebar {
        padding: 18px;
      }

      h2 {
        margin: 0 0 16px;
        font-size: 28px;
      }

      .stats {
        display: flex;
        gap: 12px;
        margin-bottom: 18px;
        flex-wrap: wrap;
      }

      .stat {
        flex: 1;
        min-width: 110px;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px 14px;
        background: rgba(255, 255, 255, 0.02);
      }

      .stat-label {
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 8px;
      }

      .stat-value {
        font-size: 24px;
        font-weight: 800;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-bottom: 18px;
      }

      button {
        cursor: pointer;
        border: 0;
        border-radius: 12px;
        padding: 12px 18px;
        font-size: 15px;
        font-weight: 700;
        color: #09121d;
        background: linear-gradient(135deg, #7dd3fc, #c4b5fd);
        transition: transform 0.12s ease;
      }

      button:hover {
        transform: translateY(-1px);
      }

      button.secondary {
        background: linear-gradient(135deg, #f9a8d4, #fca5a5);
      }

      button.danger {
        background: linear-gradient(135deg, #fca5a5, #f87171);
      }

      .player-list {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
        gap: 12px;
      }

      .player-card {
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.02);
        border-radius: 12px;
        padding: 12px;
      }

      .player-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
      }

      .player-name {
        font-weight: 700;
      }

      .host-badge {
        background: var(--accent-2);
        color: #2a1320;
        font-size: 10px;
        padding: 4px 8px;
        border-radius: 999px;
        font-weight: 800;
      }

      .player-meta {
        display: flex;
        justify-content: space-between;
        color: var(--muted);
        font-size: 13px;
      }

      .toggle {
        margin-top: 10px;
        display: inline-block;
        width: 100%;
        padding: 8px 12px;
        font-size: 13px;
      }

      .vote-box {
        margin-top: 12px;
        padding: 12px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.02);
      }

      .vote-box h3 {
        margin: 0 0 10px;
        font-size: 18px;
      }

      .vote-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
        gap: 8px;
      }

      .vote-btn {
        padding: 10px 12px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.03);
        color: white;
      }

      .log-list {
        min-height: 220px;
        list-style: none;
        padding: 0;
        margin: 16px 0 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .log-list li {
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px 12px;
        font-size: 14px;
        color: var(--muted);
      }

      @media (max-width: 980px) {
        .app {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="panel main">
        <h2>イベント管理</h2>

        <div class="stats">
          <div class="stat">
            <div class="stat-label">ステータス</div>
            <div class="stat-value" id="statusValue">待機中</div>
          </div>
          <div class="stat">
            <div class="stat-label">ラウンド</div>
            <div class="stat-value" id="roundValue">1 / 5</div>
          </div>
          <div class="stat">
            <div class="stat-label">テーマ</div>
            <div class="stat-value" id="themeValue">-</div>
          </div>
        </div>

        <div class="controls">
          <button id="startMatchBtn">ゲーム開始</button>
          <button id="startRoundBtn" class="secondary">ラウンド開始</button>
          <button id="endRoundBtn">ラウンド終了</button>
          <button id="resetBtn" class="danger">リセット</button>
        </div>

        <div class="player-list" id="playerList"></div>
      </div>

      <div class="panel sidebar">
        <h2>投票操作</h2>
        <div class="vote-box">
          <h3>投票先</h3>
          <div class="vote-grid" id="voteGrid"></div>
        </div>

        <ul class="log-list" id="logList"></ul>
      </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
      const socket = io();
      const playerList = document.getElementById('playerList');
      const voteGrid = document.getElementById('voteGrid');
      const logList = document.getElementById('logList');
      const statusValue = document.getElementById('statusValue');
      const roundValue = document.getElementById('roundValue');
      const themeValue = document.getElementById('themeValue');

      function renderPlayers(players) {
        playerList.innerHTML = '';
        players.forEach((player) => {
          const card = document.createElement('div');
          card.className = 'player-card';
          card.innerHTML = `
            <div class="player-head">
              <div class="player-name">${player.name}</div>
              ${player.isHost ? '<span class="host-badge">HOST</span>' : ''}
            </div>
            <div class="player-meta">
              <span>点数</span>
              <strong>${player.score}</strong>
            </div>
            <div class="player-meta">
              <span>状態</span>
              <strong>${player.isReady ? '準備OK' : '待機'}</strong>
            </div>
            <button class="toggle" data-player-toggle="${player.id}">${player.isReady ? '準備解除' : '準備OK'}</button>
          `;
          playerList.appendChild(card);
        });
      }

      function renderVoteGrid(players) {
        voteGrid.innerHTML = '';
        players.forEach((player) => {
          const btn = document.createElement('button');
          btn.className = 'vote-btn';
          btn.textContent = player.name;
          btn.addEventListener('click', () => {
            socket.emit('player:vote', { targetId: player.id });
          });
          voteGrid.appendChild(btn);
        });
      }

      function renderLogs(logs) {
        logList.innerHTML = '';
        logs
          .slice()
          .reverse()
          .forEach((msg) => {
            const item = document.createElement('li');
            item.textContent = msg;
            logList.appendChild(item);
          });
      }

      function applyState(state) {
        const players = state?.players || [];
        renderPlayers(players);
        renderVoteGrid(players);
        statusValue.textContent =
          state?.status === 'playing'
            ? 'プレイ中'
            : state?.status === 'result'
              ? '結果発表'
              : '待機中';
        roundValue.textContent = `${state?.round || 1} / ${state?.maxRounds || 5}`;
        themeValue.textContent = state?.selectedTheme || '-';
        renderLogs(state?.log || []);

        document.querySelectorAll('[data-player-toggle]').forEach((button) => {
          button.addEventListener('click', () => {
            socket.emit('player:ready');
          });
        });
      }

      socket.on('state:update', applyState);
      socket.on('player:me', (player) => {
        console.log('自分のプレイヤー情報', player);
      });
      socket.on('error:full', (message) => {
        window.alert(message);
      });

      document.getElementById('startMatchBtn').addEventListener('click', () => {
        socket.emit('room:start');
      });

      document.getElementById('startRoundBtn').addEventListener('click', () => {
        socket.emit('round:start');
      });

      document.getElementById('endRoundBtn').addEventListener('click', () => {
        socket.emit('round:finish');
      });

      document.getElementById('resetBtn').addEventListener('click', () => {
        socket.emit('admin:reset');
      });

      socket.emit('player:join', { name: '管理者' });
      applyState({
        status: 'waiting',
        round: 1,
        maxRounds: 5,
        selectedTheme: '-',
        players: [],
        log: ['管理画面を起動しました。'],
      });
    </script>
  </body>
</html>
